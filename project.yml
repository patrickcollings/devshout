# XcodeGen spec for the devshout app. Generate with: xcodegen generate  (Devshout.xcodeproj is git-ignored)
name: Devshout
options:
  bundleIdPrefix: com.patrickcollings
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  Core:
    path: Core
  Mac:
    path: Mac
  # Also a dependency of the Mac package (same URL, so one copy); the app imports it for the shortcut recorders.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 3.1.0
targets:
  Devshout:
    type: application
    platform: macOS
    sources:
      - path: App/Devshout
        excludes:
          - "**/*.md"
      - path: App/Resources
    dependencies:
      - package: Core
        product: DevshoutCore
      - package: Mac
        product: DevshoutMac
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleName: devshout
        CFBundleDisplayName: devshout
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: "devshout records your voice only while dictation is on. Audio stays on this Mac."
        NSHumanReadableCopyright: "© 2026 Patrick Collings"
    entitlements:
      path: App/Devshout.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_NAME: devshout
        PRODUCT_BUNDLE_IDENTIFIER: com.patrickcollings.devshout
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Devshout:
    build:
      targets:
        Devshout: all
    run:
      config: Debug
    archive:
      config: Release
